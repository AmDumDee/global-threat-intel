---
threat_summary:
  title: "Shared-Network Trust Failure Shuts Down Polish Power Plant Turbine; Zero-Click Zoom RCE Patched Same Week"
  report_date: "2026-08-11"
  threat_id: "TI-20260811-001"
  severity_business: "Critical"
  severity_technical: "Critical"

  executive_summary: |
    CERT Polska disclosed that attackers shut down a steam turbine and
    water treatment system at a Polish combined heat and power plant in
    December 2025 by pivoting through a shared private cellular network
    used to reach remote equipment — entering not through the plant's own
    systems, but through a compromised wind farm that shared the same
    network. The plant serves roughly 50,000 residents; no service
    interruption reached customers because operators responded within
    hours. CERT calls this the first documented real-world case of this
    exact attack path, and warns similar network configurations are
    common in Poland and likely elsewhere.

    This week also brought a maximum-urgency patch: a zero-click Zoom
    vulnerability (CVE-2026-53413, "Zoomsday") that let any meeting
    participant take control of another attendee's device with no user
    interaction required, affecting every Zoom client on every platform
    until patched this week. Both incidents share a governance lesson for
    boards: security requirements that govern one narrow layer (data
    encryption, single-vendor compliance) can leave the actual point of
    compromise — device administration, cross-network trust — completely
    unaddressed.

threat_intelligence:
  what_happened:
    incident_overview: |
      Attackers gained initial access through a FortiGate firewall at a
      wind farm whose VPN was exposed to the internet and allowed login
      without multi-factor authentication. From there, they obtained VPN
      credentials granting access across network segments and reached a
      private cellular network (a private APN) that a regional grid
      operator uses to connect remote equipment, including a Teltonika
      router at a separate combined heat and power (CHP) plant. That
      network allowed any connected device to communicate with any other,
      a configuration CERT found is common practice in Poland.

      The attacker used SSH tunneling through the router to reach a WAGO
      industrial controller still running default administrator
      credentials, then tunneled further into the plant's core operational
      network. After roughly a week of reconnaissance, including
      connections to three Siemens PLCs to test access, the attacker
      executed the destructive phase on December 29: switching Siemens
      S7-300, S7-1200, and S7-1500 controllers to STOP mode and
      password-protecting them, which shut down the turbine and water
      treatment system and halted cogeneration. Seven serial device
      servers and three network switches were factory-reset and
      reassigned unreachable IP addresses. CERT assesses this sequence was
      automated based on its speed and precision.

      No malware was used anywhere in the attack. Every destructive action
      used a legitimate, supported function of the equipment involved,
      executed over the plant's normal operating protocols. The attacker
      then covered their tracks: corrupting the WAGO controller's boot
      partition, factory-resetting the router and firewall, and erasing
      logs, though older router firmware retained SSH login records that
      allowed CERT to reconstruct the intrusion.

      Separately, security firm A Security disclosed CVE-2026-53413, a
      zero-click remote code execution flaw in Zoom's annotation feature
      affecting every supported client and platform. A specially crafted
      network message could corrupt memory on another meeting
      participant's device, giving an attacker code execution, camera and
      microphone access, and malware installation capability without any
      click or action from the victim. Zoom shipped patches this week
      across its Workplace, Rooms, and Meeting SDK products.

    affected_organizations:
      - name: "Polish combined heat and power plant (unnamed)"
        impact: "Turbine and process-water treatment system shut down; cogeneration interrupted; no customer service loss due to rapid recovery."
      - name: "Zoom (all platforms, all clients up to 7.0.5)"
        impact: "Zero-click RCE affecting every user until this week's patch; no confirmed exploitation reported prior to disclosure."

    attack_methodology: |
      The power plant intrusion succeeded through a trust chain spanning
      three organizations, none of which individually owned the full
      attack path: a wind farm's exposed, MFA-less VPN provided initial
      access; a shared private cellular network with no client isolation
      allowed lateral movement between otherwise unrelated facilities; and
      default credentials on an industrial controller provided the final
      pivot into the plant's operational technology network. The plant met
      its formal security requirement (encrypted DNP3.0 communications to
      its remote terminal unit) while a completely separate, unregulated
      management interface on the same physical router provided the
      actual entry point. The Zoom flaw worked differently but shares the
      same "trusted channel, unverified content" pattern: the application
      automatically parsed and rebuilt attacker-controlled network data
      without adequate validation.

  why_it_matters:
    business_risks:
      financial_exposure: |
        No direct financial figures were disclosed for the Polish
        incident, but critical infrastructure operators facing similar
        exposure should expect investigation, remediation, and potential
        regulatory costs in the high six to seven figures for a
        comparable OT intrusion, plus reputational cost disproportionate
        to the outage's brevity given the "first observed instance"
        status of the attack vector. Zoom's exposure was primarily
        reputational and remediation cost; no confirmed financial losses
        from exploitation were reported.

      regulatory_compliance: |
        The power plant met its explicit regulatory requirement for
        encrypted OT communications and was still breached, illustrating
        that compliance with data-in-transit requirements does not
        equate to device-administration security — a distinction
        regulators overseeing critical infrastructure (energy, water) are
        likely to scrutinize further following this disclosure, including
        in the U.S. given a July 30 FBI/EPA advisory that specifically
        lists private APNs as a recommended isolation architecture for
        water-sector OT.

      competitive_impact: |
        Organizations that can demonstrate cross-vendor and cross-network
        trust boundary review, not just internal system compliance, will
        differentiate themselves to critical-infrastructure regulators and
        insurers as this attack vector becomes broadly known following
        CERT Polska's disclosure.

      operational_disruption: |
        The plant recovered within roughly two hours of the destructive
        phase beginning, avoiding customer impact, but recovery occurred
        while the intruder was still active in the network — a narrow
        margin. Zoom's zero-click flaw required no user awareness measure
        to mitigate; only the vendor patch closed the exposure, meaning
        affected organizations had zero controls available to reduce risk
        until the update shipped.

    industry_patterns:
      affected_sectors:
        - "Energy and critical infrastructure (power, water)"
        - "Any organization using shared private cellular (APN) networks for OT"
        - "Enterprise and government users of Zoom (near-universal)"

      trend_analysis: |
        CERT Polska explicitly frames this as a new, previously unobserved
        attack vector — a private APN used as a lateral movement bridge
        between unrelated facilities — and states it believes similar
        permissive APN configurations are common in Poland and likely
        deployed internationally. This is part of a broader December 2025
        campaign against Polish CHP plants; a second plant was hit in the
        same wave, and multiple national agencies (Poland's government,
        CERT Polska, ESET, Dragos) issued separate assessments in January
        covering different facets of the same campaign, though none of
        those prior assessments addressed this specific intrusion until
        now, indicating investigation and disclosure of this campaign is
        still unfolding eight months later.

technical_context:
  vulnerability_details:
    cve_identifier: "CVE-2026-53413 (Zoom, CVSS not stated but described as critical zero-click); no CVE established for the Polish CHP plant intrusion"
    vulnerability_type: "Cross-network lateral movement via permissive private APN configuration and default device credentials (Polish CHP plant); stack buffer overflow in annotation protocol deserialization (Zoom)"
    affected_systems:
      - "Private APN cellular network (Polish grid operator), Teltonika RUTX50 router, WAGO PFC200 controller, Siemens S7-300/1200/1500 PLCs"
      - "Zoom Workplace, Rooms, and Meeting SDK clients on Windows, Mac, iOS, Android, and Linux (versions up to and including 7.0.5)"
    exploitation_status: "Confirmed exploited in the wild (Polish CHP plant, December 2025); Zoom flaw was responsibly disclosed with no confirmed in-the-wild exploitation reported prior to patch"

  attack_indicators:
    - "Unexpected administrative logins or configuration changes on devices reachable through shared or third-party-managed networks"
    - "Industrial controllers switching to STOP/halted states outside scheduled maintenance windows"
    - "Factory resets or credential changes on network equipment with no corresponding change-management record"

strategic_response:
  executive_decisions:
    - priority: "Critical"
      decision: "Deploy the Zoom security update (Workplace 7.1.5/7.0.6, Rooms 7.1.5, Meeting SDK 7.1.5) across all endpoints immediately, treating it as a zero-click, no-user-action-required emergency patch rather than standard patch-cycle timing."
      business_justification: "The flaw required no victim interaction whatsoever; standard security awareness controls provide zero mitigation, making the vendor patch the only available risk reduction."
      cost_estimate: "Low — standard software update rollout, achievable within a day for most environments."
    - priority: "Critical"
      decision: "Audit every private or third-party-managed network (cellular APNs, shared vendor VPNs, partner network connections) that any OT or industrial system connects through, and require client isolation or equivalent segmentation regardless of who administers the network."
      business_justification: "The Polish plant's own security posture was irrelevant to this breach; the compromise came entirely through a network the plant did not own or operate, a blind spot most OT risk assessments do not currently cover."
      cost_estimate: "Medium to High — requires cross-organizational coordination with network operators/vendors and potential architecture changes; timeline likely 4-12 weeks depending on scope."
    - priority: "High"
      decision: "Require default-credential elimination as a mandatory, audited control for all OT and industrial controller deployments, verified independently of vendor deployment attestations."
      business_justification: "The WAGO controller's default admin credentials were the pivot point into the plant's OT network despite being a known, basic security failure — this is a low-cost, high-impact control gap."
      cost_estimate: "Low — credential audit and rotation, primarily labor cost."

  governance_implications:
    board_reporting: |
      Report: inventory of third-party or shared networks connecting to
      OT/critical systems and their isolation status; time-to-patch for
      zero-click/no-interaction vulnerabilities versus standard patch
      cycle; percentage of industrial controllers verified free of
      default credentials.

    disclosure_requirements: |
      No specific disclosure trigger applies to U.S. organizations from
      this Polish incident directly, but any organization using a private
      APN architecture referenced in the July 30 FBI/EPA water-sector
      advisory should review that guidance against its own deployment
      immediately, as federal guidance now explicitly addresses this
      architecture.

analysis_and_insights:
  uncomfortable_truths: |
    The Polish plant did everything its formal security requirement
    asked of it — encrypted communications to its remote terminal unit —
    and was breached anyway, because the requirement governed data in
    transit, not who could administer the device carrying that data. This
    is a governance failure pattern more dangerous than a missed patch:
    a checklist that gets fully satisfied while leaving the actual attack
    surface untouched. Boards that measure security by compliance
    completion rather than attack-path analysis are measuring the wrong
    thing.

    The attack also required zero malware. Every destructive action was a
    legitimate, supported function of equipment operating exactly as
    configured. Detection strategies built around malware signatures or
    anomalous file behavior would have caught none of this — the
    detection gap here is in administrative activity monitoring, not
    endpoint protection.

  strategic_lessons:
    - "Compliance with a narrow security requirement (e.g., encrypted data transit) does not eliminate risk from an entirely separate, unregulated interface on the same device."
    - "Cross-organizational network sharing (private APNs, partner VPNs) creates attack paths that fall outside any single organization's security ownership — this must be explicitly mapped, not assumed absent."

forward_outlook:
  predictions: |
    Expect additional disclosures tied to the broader December 2025
    Polish CHP campaign as investigation continues; CERT Polska notes
    multiple prior assessments from different agencies have each covered
    only part of the campaign, suggesting the full scope is still
    emerging eight months later. Given CERT's assessment that permissive
    private APN configurations are common beyond Poland, expect similar
    disclosures from other countries' critical infrastructure sectors
    within the next two to three quarters as operators audit their own
    shared cellular network configurations in response.

    Over 6-12 months, expect zero-click vulnerabilities in widely used
    collaboration tools (following the Zoom precedent) to draw increased
    scrutiny toward vendor patch-response speed as a procurement and risk
    criterion, given that user-side mitigations are structurally
    impossible against this vulnerability class.

