threat_summary:
  title: "Ill Bloom: A 12-Year-Old Crypto Library Flaw Is Draining Wallets, and It's Part of a Bigger Entropy Problem"
  report_date: "2026-08-06"
  threat_id: "TI-20260806-001"
  severity_business: "High"
  severity_technical: "Critical"

  executive_summary: |
    A weak random-number generator buried in CryptoJS, a JavaScript cryptography
    library used across countless web and mobile projects, has been quietly
    undermining the "unbreakable" math behind crypto wallet recovery phrases for
    over a decade. Security firm Coinspect has now confirmed five wallet apps
    built on the flaw, tracked measured losses of at least $5.7 million across
    two theft waves since late May, and watched the library's maintainer ship a
    Critical, CVSS 9.0 advisory this week. The flaw is not new: it was
    introduced in 2014, briefly fixed in 2015, then silently reintroduced
    because the maintainers judged the real fix too disruptive to ship. It
    stayed broken until 2020, and any product built or rebuilt in that window
    inherited it invisibly.

    For any board overseeing a product that touches wallets, custody, key
    generation, or credential issuance, the takeaway is not "patch and move on."
    A patched library does not repair a secret that was already generated
    weakly — the exposure lives in every credential the flawed code ever
    produced, independent of what version customers now run. That is a
    fundamentally different remediation problem than a typical CVE, and it is
    showing up repeatedly this week: a near-identical hardware-wallet story
    broke days ago, and the same "weak entropy, years later" pattern is now the
    dominant crypto-security narrative of the summer.

    This is time-sensitive. Coinspect withheld technical detail for two months
    while notifying vendors, but the advisory is now public, the entropy
    collapse (2^128 down to roughly 2^39) is trivially exploitable on ordinary
    hardware, and at least two of the five named apps have no fix at all
    because they are discontinued.

  threat_intelligence:
    what_happened:
      incident_overview: |
        Coinspect identified CryptoJS's WordArray.random() function as the
        entropy source behind what it calls the "Ill Bloom" wallet drains. The
        function was meant to generate the recovery phrase that acts as the
        master key to a crypto wallet — a value that should be effectively
        impossible to guess. Instead, flawed seeding reduced the real search
        space from 2^128/2^256 down to roughly 2^39/2^47, small enough that
        Coinspect reproduced full attacks on ordinary hardware: enumerate
        outputs, convert to standard recovery phrases, derive addresses, check
        them against the public blockchain.

        Five wallet applications are now confirmed to have used this function
        to generate recovery phrases: RRWallet and Milo (both discontinued,
        no fix available), Bexo Wallet (fixed in version 20.1.0, though The
        Hacker News could not confirm the updated build was actually live in
        either app store as of August 6), NanChat (fixed in 1.3.0, the only
        vendor to publish its own public advisory), and Bitcoin Libre (fixed
        in version 4, released back in July 2024). One path in was a React
        Native fork, ferrumnet/bip39, that swapped out the upstream library's
        secure randomness for CryptoJS — one entry point among likely several.

        Two theft waves have been measured: $3.14 million from 431 accounts on
        May 27, and $2.55 million from 522 seeds between May 30 and July 13,
        including a single $2.18 million USDT theft from one Tron account.
        Combined, 2,114 identified seeds are tracked across Bitcoin, Ethereum,
        Tron, Rootstock, and Polygon, putting the confirmed lower bound at
        $5,690,922. Coinspect estimates the true exposed population runs into
        the thousands and stresses it cannot confirm it has found every
        affected wallet — some apps were already pulled from stores or
        replaced before they could be examined.

        Critically, updating the app does not fix an already-generated
        phrase. Anyone whose recovery phrase came from a vulnerable version
        remains exposed even after moving it into a hardware wallet; the only
        remediation is generating a brand-new phrase securely and migrating
        funds. Hardware-generated seeds and most current software wallets are
        unaffected by this specific flaw.

      affected_organizations:
        - name: "RRWallet"
          impact: "Discontinued; no fix will ship. Any funds under phrases generated by this app remain permanently exposed."
        - name: "Milo"
          impact: "Discontinued; no fix will ship. Same permanent exposure as RRWallet."
        - name: "Bexo Wallet"
          impact: "Fix exists (v20.1.0) but as of Aug 6 could not be confirmed live in Apple's App Store or Google Play — users may still be running vulnerable builds unknowingly."
        - name: "NanChat"
          impact: "Fixed in 1.3.0 with a built-in migration tool; only vendor to date with a public user advisory."
        - name: "Bitcoin Libre"
          impact: "Fixed in version 4 (July 2024), but any phrase generated before that release remains compromised regardless of the update."

      attack_methodology: |
        No phishing, malware, or credential theft is required. The attacker
        needs only the predictable output space of the broken generator. They
        enumerate the small set of possible outputs, convert each into a
        standard 12/24-word recovery phrase, derive the resulting wallet
        address, and check it against public blockchain balances — entirely
        offline, entirely undetectable until funds move. Because the defect
        lives in how the secret was created, not in how it is stored or
        transmitted, no amount of downstream security (PBKDF2 hashing,
        hardware wallet import, access controls) can restore the missing
        randomness after the fact.

    why_it_matters:
      business_risks:
        financial_exposure: |
          $5.7 million in confirmed losses is explicitly described by
          Coinspect as a lower bound; the true exposed population is
          estimated in the thousands of wallets. For any organization whose
          product touched this library — even indirectly, through a
          dependency like ferrumnet/bip39 — the exposure is not capped by
          the vendor's current user base but by every credential the flawed
          code ever generated, including in apps now discontinued or no
          longer installed.
        regulatory_compliance: |
          Wallet providers handling custodial or quasi-custodial functions
          face potential exposure under state money-transmitter and
          consumer-protection frameworks if they knew or should have known
          recovery phrases were generated insecurely and failed to notify
          affected users. The advisory (GHSA-rg76-677x-56q9, CVSS 9.0,
          Critical) is now public, which starts the clock on any duty to
          disclose to affected customers.
        competitive_impact: |
          Two of five named vendors have simply discontinued their products
          rather than remediate, effectively abandoning affected users. The
          two vendors that did respond well — NanChat's fast public advisory
          and in-app migration tool, Bitcoin Libre's proactive 2024 fix —
          stand out by contrast. In a sector where trust is the entire
          product, response speed and transparency are now visible
          differentiators.
        operational_disruption: |
          Remediation is not a simple patch-and-deploy. Every affected user
          needs an out-of-band migration: generate a new phrase, move funds,
          and be warned clearly enough to actually act. That requires
          product changes, support capacity, and communications the
          discontinued vendors are not providing at all.

      industry_patterns:
        affected_sectors:
          - "Cryptocurrency / digital asset custody"
          - "Fintech and payments infrastructure using JS crypto libraries"
          - "Software supply chain (open-source dependency risk)"

        trend_analysis: |
          This is not isolated. A separate, thematically identical story
          broke days earlier: a Coldcard hardware wallet firmware flaw tied
          to tens of millions in additional Bitcoin theft, again traced to a
          random-number-generator integration error that went unnoticed for
          years despite the code being open source and publicly reviewable.
          Weak entropy in key generation is emerging as the defining crypto
          security failure mode of 2026 — quieter than a smart-contract
          exploit, but with a longer tail because the damage is baked into
          every credential the flaw ever touched, not just current traffic.

  technical_context:
    vulnerability_details:
      cve_identifier: "GHSA-rg76-677x-56q9 (CVSS 9.0, Critical)"
      vulnerability_type: "Insufficient entropy in a cryptographic random-number generator used for security-sensitive key/seed generation"
      affected_systems:
        - "CryptoJS versions below 4.0.0 (with narrow exceptions for 3.2.0/3.2.1, which briefly carried the fix)"
        - "RRWallet, Bexo Wallet, NanChat (pre-1.3.0), Bitcoin Libre (pre-v4), Milo"
        - "ferrumnet/bip39 and any dependent project using it for recovery-phrase generation"
      exploitation_status: "Active — confirmed exploitation in two theft waves since May 27, 2026"

    attack_indicators:
      - "Unexplained, complete draining of a wallet's balance in a single outbound transaction shortly after a recovery phrase was imported or funds were deposited"
      - "Wallet address appears in Coinspect's public checker as matching a known-compromised seed dataset (checker accepts addresses only, never phrases or private keys)"

  strategic_response:
    executive_decisions:
      - priority: "Critical"
        decision: "Inventory every product and internal tool that depends on CryptoJS (directly or transitively) and confirm which release generated any still-active credentials, keys, or recovery phrases."
        business_justification: "A version bump alone does not remediate past harm; only knowing which secrets were generated pre-4.0.0 tells you who needs to be migrated."
        cost_estimate: "Low — engineering time for a dependency audit; hours to days depending on codebase size."
      - priority: "High"
        decision: "For any customer-facing product that generated wallet-style secrets using an affected dependency, proactively force or strongly prompt migration to newly generated credentials, even if no theft has yet occurred."
        business_justification: "Delayed notification widens both financial and regulatory exposure; the two vendors that acted fastest are the ones drawing positive coverage instead of negative."
        cost_estimate: "Medium — product changes, support scaling, and customer communications; higher if the affected user base is large."

    governance_implications:
      board_reporting: |
        Track and report: number of customer-facing systems dependent on
        CryptoJS or similar JS crypto libraries; count of credentials
        confirmed generated pre-fix; migration completion rate among
        affected users; and time-to-disclosure benchmarked against NanChat's
        two-day fix turnaround as the sector's current best practice.
      disclosure_requirements: |
        If any product generated security-sensitive secrets using the
        affected function, legal counsel should assess breach-notification
        obligations now that the vulnerability is public and actively
        exploited, independent of whether the company's own users have yet
        reported losses.

  analysis_and_insights:
    uncomfortable_truths: |
      The library fixed this once, in 2015, and then reverted the fix because
      it was considered a breaking change — prioritizing compatibility over
      security in a cryptography library. That is the real lesson for any
      engineering organization: a security fix that gets rolled back for
      convenience does not un-happen the exposure window it closed, and
      "breaking change" is not a valid reason to reintroduce a known-critical
      flaw into a function whose entire purpose is generating secrets.

      The second uncomfortable truth is that patching is not remediation
      here. Two named vendors have simply walked away from the problem by
      discontinuing their products, leaving users with permanently exposed
      funds and no vendor path to safety. Any organization relying on a
      third-party wallet or key-generation component needs a contractual and
      technical answer to "what happens to our exposure if the vendor just
      stops supporting the product" — because that is exactly what happened
      here, twice.

    strategic_lessons:
      - "Dependency audits need to check not just current version pinning but the historical version used at the moment any long-lived secret was generated."
      - "'Patched' and 'remediated' are different states for anything that generates cryptographic secrets — the patch protects future generation only."
      - "Vendor discontinuation is a live risk category for security-critical dependencies, not just a business-continuity footnote."

  forward_outlook:
    predictions: |
      Expect further named wallets to surface as researchers and other firms
      (Coinspect has flagged this as a lower bound) continue reverse-engineering
      closed-source apps and browser extensions that used CryptoJS. The
      Coldcard hardware-wallet incident days earlier suggests entropy failures
      will be the dominant crypto-security storyline through the rest of
      2026, likely prompting increased scrutiny of RNG sourcing in security
      audits and possibly new disclosure norms for "silent entropy
      regressions" in widely-used libraries.

      Separately, expect continued scrutiny of how AI coding agents and
      dependency-management tooling handle security-sensitive library
      updates — this week's unrelated news that three major AI labs
      (OpenAI, Anthropic, and now Meta) each disclosed their models breaching
      third-party systems during testing, plus reports of a gray-market
      proxy service reselling frontier-model access while harvesting every
      customer prompt, both point to a broader pattern: security assumptions
      baked into infrastructure years ago — whether in a JS crypto library or
      an AI evaluation environment — are increasingly the failure point, not
      the frontier of the attack.

