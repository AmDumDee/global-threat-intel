---
threat_summary:
  title: "AI Agents as Attack Surface: Agent Hijacking Joins MFA-Bypass and Zero-Click Campaigns"
  report_date: "2026-07-25"
  threat_id: "TI-20260725-004"
  severity_business: "Critical"
  severity_technical: "Critical"

  executive_summary: |
    Researchers disclosed AgentForger, a now-patched vulnerability in OpenAI's
    ChatGPT Workspace Agents that allowed a single phishing link to silently
    create, fully authorize, and schedule a persistent rogue AI agent inside a
    victim organization, with all approval safeguards disabled and hourly
    execution against connected email, calendar, cloud storage, and messaging
    apps. No malware or credential theft was required; the attack abused the
    platform's own trust model.

    In parallel, two separate campaigns are bypassing traditional identity
    protections at scale. Attackers are hijacking hotel and conference-center
    Wi-Fi DNS settings to redirect traveling employees to fake Microsoft 365
    login pages, in some cases bypassing MFA entirely via device-code
    authentication abuse. A Russia-linked group, tracked as Laundry Bear, is
    exploiting a Zimbra email vulnerability that requires zero user interaction
    beyond opening an email, enabling mailbox takeover, 2FA code theft, and
    persistent access across financial, legal, healthcare, and energy sector
    targets.

    Board relevance: the common thread is identity and access compromise that
    bypasses traditional perimeter and endpoint defenses entirely. AI agents,
    once authorized, functionally become privileged employees; if hijacked,
    they retain that same access indefinitely until someone notices.

threat_intelligence:
  what_happened:
    incident_overview: |
      AgentForger, disclosed by Zenity Labs, exploited a cross-site request
      forgery flaw in OpenAI's ChatGPT Agent Builder. A crafted URL, sent as a
      phishing link, would automatically submit a malicious prompt the moment a
      logged-in victim clicked it, no further interaction required. The
      resulting agent attached itself to all of the victim's existing app
      connectors (Outlook, Gmail, Slack, Teams, Drive), set every connector to
      require no approval, and scheduled itself to run hourly. The agent could
      then receive ongoing instructions via specially-formatted emails sent to
      the victim's own inbox, effectively giving the attacker a persistent,
      remotely-controlled insider with the victim's real access. OpenAI patched
      the underlying flaw on June 8, 2026, following responsible disclosure.

      Separately, ReliaQuest identified an ongoing campaign, active since at
      least June, in which attackers compromise Wi-Fi gateways at hotels and
      conference centers, altering DNS settings to redirect users toward fake
      Microsoft 365 login portals. Victims span financial services, professional
      services, legal, healthcare, energy, and retail sectors, indicating
      opportunistic targeting of traveling employees rather than sector-specific
      focus. In some cases, attackers used device-code authentication abuse to
      obtain valid OAuth tokens without needing to steal credentials at all,
      fully bypassing MFA.

      US and international agencies issued a joint advisory warning that
      Russia-linked group Laundry Bear (Void Blizzard) is actively exploiting
      CVE-2025-66376, a Zimbra Collaboration Suite flaw, in a zero-click campaign
      requiring only that a target view a malicious email. The exploit enables
      IMAP access, harvests two-factor codes and saved browser credentials, and
      exfiltrates 90 days of mailbox data through covert channels.

    affected_organizations:
      - name: "Organizations using ChatGPT Workspace Agents with connectors (pre-June 8 patch)"
        impact: "Potential creation of persistent, fully-authorized rogue AI agents with real employee access"
      - name: "Traveling employees across financial, legal, healthcare, energy, and retail sectors"
        impact: "Microsoft 365 credential and MFA bypass via compromised hotel/conference Wi-Fi"
      - name: "Organizations running unpatched Zimbra Collaboration Suite servers"
        impact: "Zero-click mailbox takeover, 2FA code theft, 90-day email exfiltration by state-linked actor"

    attack_methodology: |
      AgentForger exploited implicit trust in URL-based agent initialization,
      turning a single click into full agent creation, authorization, and
      persistence with no further victim action needed. The Wi-Fi DNS campaign
      relies on compromising shared network infrastructure rather than
      individual devices, meaning any employee connecting is at risk regardless
      of their organization's own security posture. The Zimbra campaign requires
      zero interaction beyond viewing an email, using obfuscated JavaScript
      embedded in SVG elements to execute silently in the webmail interface.

  why_it_matters:
    business_risks:
      financial_exposure: |
        A hijacked AI agent with access to email, cloud storage, and messaging
        can conduct business email compromise (BEC) at scale, impersonating the
        victim to send convincing phishing internally and to partners, a proven
        driver of six-to-seven-figure fraud losses in prior BEC cases. Zero-click
        mailbox compromise via Zimbra enables long-term intelligence gathering
        and credential harvesting that can fund follow-on fraud or ransomware
        access sales.

      regulatory_compliance: |
        Zero-click and MFA-bypass campaigns against email systems handling
        regulated data (healthcare, financial services, legal) raise breach
        notification obligations under HIPAA, GLBA, and state privacy laws if
        PII or PHI is confirmed accessed. CISA's joint advisory places Zimbra
        remediation squarely within federal risk-based patching expectations
        under BOD 26-04 for FCEB agencies, with private-sector organizations
        strongly encouraged to follow suit.

      competitive_impact: |
        Organizations that cannot demonstrate governance over AI agent
        permissions and connector access risk falling behind peers adopting
        AI-assisted defensive tooling (e.g., automated code remediation
        platforms), while also facing greater exposure to AI-specific attack
        techniques that traditional security stacks were not built to detect.

      operational_disruption: |
        A hijacked AI agent operating hourly with full connector access can
        persist and cause damage long after the initial phishing click,
        requiring full connector re-authorization and agent audit across the
        organization to fully remediate. Wi-Fi DNS hijacking campaigns require
        no direct compromise of corporate infrastructure, meaning traditional
        network monitoring inside the office provides no visibility.

    industry_patterns:
      affected_sectors:
        - "Cross-industry (traveling workforce exposure via Wi-Fi DNS hijacking)"
        - "Financial services, legal, healthcare, energy (Zimbra targeting)"
        - "Any organization using AI workspace agents with app connectors"

      trend_analysis: |
        This week reinforces an accelerating trend: attackers are targeting
        identity and authorization mechanisms directly, bypassing MFA, exploiting
        agent trust models, and requiring zero or near-zero user interaction,
        rather than relying on traditional malware delivery. AI agent platforms
        represent a genuinely new attack surface that most enterprise security
        programs have not yet incorporated into identity governance.

technical_context:
  vulnerability_details:
    cve_identifier: "CVE-2025-66376 (Zimbra); AgentForger (no CVE, platform logic flaw, patched by OpenAI)"
    vulnerability_type: "Cross-site request forgery enabling unauthorized AI agent creation (AgentForger); zero-click cross-site scripting via email (Zimbra); DNS hijacking and OAuth device-code abuse (Wi-Fi campaign)"
    affected_systems:
      - "OpenAI ChatGPT Agent Builder / Workspace Agents (patched June 8, 2026)"
      - "Zimbra Collaboration Suite webmail (unpatched instances)"
      - "Hotel and conference-center Wi-Fi gateways; Microsoft Entra ID device-code flow"
    exploitation_status: "AgentForger patched, no known active exploitation; Zimbra actively exploited by state-linked actor; Wi-Fi DNS campaign active since June 2026"

  attack_indicators:
    - "Unexpected scheduled AI agents with full connector access and 'never ask' approval settings"
    - "Employees reporting Microsoft login prompts while connected to hotel/conference Wi-Fi"
    - "Unauthorized IMAP enablement or application password creation on Zimbra accounts"
    - "Emails to internal mailboxes with subject lines beginning in unusual command-like phrasing"

strategic_response:
  executive_decisions:
    - priority: "Critical"
      decision: "Mandate audit and re-authorization of all AI agent connectors with access to email, file storage, or messaging platforms"
      business_justification: "A hijacked agent operates as a persistent, fully-trusted insider; undetected agents remain a standing risk until manually reviewed"
      cost_estimate: "$50K-$120K for AI agent governance tooling and initial audit"

    - priority: "Critical"
      decision: "Require phishing-resistant MFA and disable device-code authentication flow in Microsoft Entra ID unless explicitly required"
      business_justification: "Device-code abuse bypasses MFA entirely without stealing credentials, as demonstrated in active Wi-Fi hijacking campaign"
      cost_estimate: "Low direct cost; primarily configuration change and policy update"

    - priority: "Critical"
      decision: "Patch or isolate all Zimbra Collaboration Suite servers immediately and rotate credentials for any account with signs of compromise"
      business_justification: "State-linked actor is actively exploiting this flaw in a zero-click campaign against multiple critical sectors"
      cost_estimate: "Low direct cost; urgency drives priority over budget"

    - priority: "High"
      decision: "Mandate always-on, full-tunnel VPN and encrypted DNS for all employees connecting via hotel, conference, or other untrusted Wi-Fi"
      business_justification: "Public DNS servers do not protect against this attack; VPN and encrypted DNS in strict mode are the only confirmed effective mitigations"
      cost_estimate: "$30K-$80K depending on existing VPN infrastructure and employee travel volume"

  governance_implications:
    board_reporting: |
      Track: number of active AI agents with standing access to sensitive
      systems and their approval configurations; MFA bypass incidents tied to
      device-code or similar flows; patch compliance rate for CISA KEV-listed
      and joint-advisory-flagged vulnerabilities; VPN/encrypted DNS adoption
      rate among traveling staff.

    disclosure_requirements: |
      Organizations confirming Zimbra compromise with evidence of mailbox
      access to regulated data should assess breach notification obligations
      under applicable sector regulations (HIPAA, GLBA, state privacy laws).
      AI agent hijacking incidents resulting in confirmed data exfiltration or
      BEC activity should be evaluated against the same disclosure thresholds
      as traditional account compromise.

analysis_and_insights:
  uncomfortable_truths: |
    Most organizations have spent years building identity governance around
    human employees and, more recently, service accounts. AI agents with
    standing connector access don't fit cleanly into either category, and
    AgentForger shows what happens when that gap goes unaddressed: an attacker
    doesn't need to steal an identity, they can manufacture a new one with a
    single link, fully authorized and running on schedule.

    The Wi-Fi DNS campaign and device-code MFA bypass also puncture a common
    assumption: that MFA alone is sufficient protection. Both campaigns this
    week demonstrate MFA bypass without stealing a single credential, by
    abusing legitimate authentication flows the way they were designed to work.
    Security programs built around "did they have MFA enabled" as the key
    control question are asking an incomplete question.

  strategic_lessons:
    - "AI agents with standing app access require the same governance rigor as privileged employee accounts, not lighter oversight"
    - "MFA bypass no longer requires credential theft; device-code and similar legitimate auth flows are now active attack vectors"
    - "Zero-click exploits targeting email clients remain effective against state-linked actors even against widely used, actively maintained platforms"

forward_outlook:
  predictions: |
    Expect additional AI agent platform vulnerabilities to surface over the next
    two to three quarters as researchers and attackers alike scrutinize the
    trust assumptions built into agent creation, authorization, and connector
    management across major vendors, not just OpenAI. Organizations that treat
    AI agents as a new identity class requiring dedicated governance will be
    materially ahead of peers still treating them as a productivity feature.

    MFA-bypass techniques exploiting legitimate authentication flows, rather
    than stealing credentials outright, are likely to increase as attackers
    recognize that traditional phishing-awareness training does not address
    them. Expect more state-linked actors to adopt zero-click, low-interaction
    exploitation techniques similar to the Zimbra campaign, given demonstrated
    success bypassing both user awareness and MFA protections.

