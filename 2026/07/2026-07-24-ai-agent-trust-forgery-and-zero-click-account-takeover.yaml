---
threat_summary:
  title: "Forged Trust: AI Agent Hijacking and Zero-Click Account Takeover Redefine the Attack Surface"
  report_date: "2026-07-24"
  threat_id: "TI-20260724-004"
  severity_business: "Critical"
  severity_technical: "Critical"

  executive_summary: |
    Researchers disclosed AgentForger, a now-patched flaw in OpenAI's ChatGPT
    Workspace Agent Builder that allowed a single phishing link to silently
    create a persistent, autonomous AI agent inside a victim's company account,
    with all approval safeguards disabled and full access to connected business
    tools like Outlook, Slack, and Google Drive. Separately, attackers are
    hijacking Wi-Fi DNS settings at hotels and conference centers to redirect
    business travelers to fake Microsoft 365 login pages that bypass MFA via a
    device-code authentication trick, actively targeting financial services,
    legal, healthcare, and energy sector employees. A Russia-linked group,
    Laundry Bear, is separately exploiting a zero-click Zimbra email
    vulnerability that compromises accounts the moment a malicious email is
    viewed, no click required at all.

    Board relevance: two of this week's three major attack techniques bypass the
    security controls most organizations rely on most heavily, MFA and
    phishing-awareness training. The AgentForger flaw in particular signals a
    new attack category: forging the trust an AI agent operates under, rather
    than stealing credentials directly. Meanwhile, Google and Meta are both
    shipping AI-driven defensive tools (automated patching, identity
    verification) as the industry response to this same acceleration.

threat_intelligence:
  what_happened:
    incident_overview: |
      Zenity Labs disclosed AgentForger, a cross-site request forgery
      vulnerability in ChatGPT's Agent Builder that let an attacker embed a
      complete agent-creation instruction inside a URL. When a logged-in
      employee with an existing enterprise connector (Outlook, Gmail, Slack,
      Teams, etc.) clicked the link, ChatGPT automatically built and activated
      an AI agent using the chief-of-staff template, attached all available
      connectors with approvals switched off, scheduled it to run hourly, and
      configured it to check for attacker instructions via email and report
      results back. The forged agent could harvest sensitive documents,
      passwords shared in Slack, and impersonate the victim to send further
      phishing links to coworkers. OpenAI patched the flaw as of June 8, 2026.

      Separately, ReliaQuest identified an ongoing campaign, active since at
      least June, in which attackers compromise Wi-Fi gateways at hotels and
      conference centers across multiple countries and redirect DNS traffic to
      fake Microsoft 365 login portals. In some cases, attackers used a
      device-code authentication flow that tricks the victim into approving a
      legitimate-looking login prompt, which issues a valid OAuth token to the
      attacker without stealing any password, bypassing MFA entirely. The
      campaign shows overlap with tactics used by the Russia-linked APT28 group.

      US and international agencies issued a joint advisory warning that
      Russian-linked group Laundry Bear (Void Blizzard) is actively exploiting
      CVE-2025-66376, a Zimbra Collaboration Suite flaw that executes malicious
      JavaScript the moment a user views an email, requiring no click or
      download. The group uses this zero-click access to enable IMAP,
      create hidden application passwords, harvest MFA codes, and exfiltrate up
      to 90 days of mailbox data.

      In response to this environment, Google launched a public preview of
      CodeMender, an AI agent that scans code for vulnerabilities, builds a
      proof-of-concept exploit to confirm exploitability, and generates a
      developer-reviewed patch. Meta separately introduced Facebook Verified, a
      free selfie-based identity badge intended to help users distinguish real
      people from AI-generated or bot accounts.

    affected_organizations:
      - name: "Organizations using ChatGPT Workspace Agents with enterprise connectors"
        impact: "Potential persistent, autonomous unauthorized access to email, Slack, Teams, and cloud storage prior to June 8, 2026 patch"
      - name: "Traveling employees across financial services, legal, healthcare, energy, and retail sectors"
        impact: "Microsoft 365 account compromise via hijacked hotel/conference Wi-Fi, bypassing MFA"
      - name: "Organizations running unpatched Zimbra Collaboration Suite"
        impact: "Zero-click account takeover, mailbox exfiltration, and persistent IMAP-based access"

    attack_methodology: |
      AgentForger exploited a CSRF-style trust gap: the platform assumed any
      agent creation and configuration action reflected genuine user intent,
      when in fact a single crafted URL could trigger the entire chain
      automatically. The Wi-Fi DNS campaign relies on compromised network
      infrastructure to intercept and redirect legitimate-looking authentication
      flows, exploiting user trust in device-code prompts rather than stealing
      credentials directly. The Zimbra campaign requires zero user interaction
      beyond viewing an email, using obfuscated JavaScript embedded in SVG
      elements to execute a multi-stage credential and data theft script.

  why_it_matters:
    business_risks:
      financial_exposure: |
        A persistent, undetected AI agent with access to email, calendar,
        Slack, and cloud storage creates business email compromise (BEC) and
        data exfiltration risk comparable to a full insider threat, with
        potential costs scaling into the millions depending on data sensitivity
        and dwell time. Zero-click Zimbra compromise enables mailbox
        exfiltration and downstream fraud (e.g., invoice fraud, wire transfer
        redirection) without any employee error to point to.

      regulatory_compliance: |
        Both the Wi-Fi DNS hijacking and Zimbra zero-click campaigns bypass MFA,
        undermining a control regulators and cyber insurers commonly treat as a
        baseline requirement; incidents traced to these vectors may complicate
        insurance claims or regulatory defense arguments. CISA, NSA, and FBI
        have issued formal advisories on the Zimbra campaign, raising the bar
        for demonstrating due diligence if exploited post-advisory.

      competitive_impact: |
        AI agent platforms (ChatGPT, and by extension similar tools from other
        vendors) face trust scrutiny following AgentForger; enterprises may
        favor platforms that can demonstrate non-bypassable approval controls
        for autonomous agents as a differentiator in vendor selection.

      operational_disruption: |
        Organizations with unpatched Zimbra servers face mailbox-wide
        compromise requiring full credential rotation, application password
        audits, and 90-day data exposure review. Wi-Fi-based MFA bypass
        requires reissuing OAuth tokens and reviewing all sessions originating
        from travel-related network connections.

    industry_patterns:
      affected_sectors:
        - "Enterprise AI/SaaS platforms (agent trust boundary)"
        - "Financial services, legal, healthcare, energy, retail (Wi-Fi DNS campaign)"
        - "Email/collaboration infrastructure (Zimbra)"
        - "Cross-industry (AI-generated account/identity trust, per Meta's response)"

      trend_analysis: |
        This week marks a clear escalation from AI-assisted attacks to attacks
        that directly forge the trust relationship an AI agent operates under,
        a fundamentally new category. Combined with MFA-bypassing techniques
        (device-code phishing, zero-click exploits), the pattern shows attackers
        systematically targeting the specific controls organizations rely on
        most, while defenders respond with AI-driven detection and patching
        tools of their own.

technical_context:
  vulnerability_details:
    cve_identifier: "CVE-2025-66376 (Zimbra Collaboration Suite); AgentForger (no CVE, vendor-patched CSRF flaw)"
    vulnerability_type: "Cross-site request forgery enabling unauthorized AI agent creation (ChatGPT); zero-click XSS via email (Zimbra); DNS hijacking with MFA-bypassing device-code phishing (Wi-Fi campaign)"
    affected_systems:
      - "OpenAI ChatGPT Workspace Agent Builder (patched June 8, 2026)"
      - "Zimbra Collaboration Suite (unpatched instances)"
      - "Hotel and conference center Wi-Fi gateways; Microsoft Entra ID device-code flow"
    exploitation_status: "Patched (AgentForger); Active exploitation confirmed (Zimbra, Wi-Fi DNS hijacking)"

  attack_indicators:
    - "Unrecognized scheduled AI agents or workflows connected to corporate email/Slack/Teams accounts"
    - "Employee-approved device-code login prompts while connected to hotel or conference Wi-Fi"
    - "Zimbra webmail accounts with unexpectedly enabled IMAP access or unfamiliar application passwords"
    - "DNS resolution for Microsoft login domains returning unfamiliar IP ranges while on travel networks"

strategic_response:
  executive_decisions:
    - priority: "Critical"
      decision: "Mandate immediate audit of all AI agents connected to enterprise email, Slack, Teams, and cloud storage, with required owner attribution and approval-setting review"
      business_justification: "AgentForger demonstrated agents can be created and granted full access without genuine employee intent; unaudited agents may still exist from before the patch"
      cost_estimate: "$50K-$120K for audit and AI agent governance tooling"

    - priority: "Critical"
      decision: "Patch all Zimbra Collaboration Suite instances immediately and rotate credentials/application passwords per CISA IOC guidance"
      business_justification: "Zero-click exploitation is active and requires no user error, closing this gap is the only mitigation"
      cost_estimate: "Low direct cost; primarily IT operations time for patch and credential rotation"

    - priority: "High"
      decision: "Disable Device Code authentication flow in Microsoft Entra ID unless explicitly required for specific use cases"
      business_justification: "This flow allows MFA bypass without credential theft, as demonstrated in the Wi-Fi DNS hijacking campaign"
      cost_estimate: "Minimal; configuration change with IT change-management review"

    - priority: "High"
      decision: "Mandate full-tunnel VPN and encrypted DNS (DNS-over-HTTPS/TLS in strict mode) for all devices used during business travel"
      business_justification: "Public DNS servers alone do not prevent this attack since the gateway intercepts requests before reaching any resolver"
      cost_estimate: "$30K-$80K depending on existing VPN infrastructure and device fleet size"

  governance_implications:
    board_reporting: |
      Track: number of active AI agents discovered per audit cycle and their
      connector/approval configurations; patch compliance rate for
      Zimbra/collaboration email infrastructure; percentage of travel devices
      enforcing full-tunnel VPN and encrypted DNS; MFA bypass incident count.

    disclosure_requirements: |
      Organizations confirming Zimbra compromise per CISA's published IOCs
      should assess breach notification obligations given the campaign's
      90-day mailbox data exfiltration scope, particularly where regulated
      customer or patient data may be present in affected accounts.

analysis_and_insights:
  uncomfortable_truths: |
    Most enterprises have no inventory of AI agents operating inside their
    environment, who created them, what they're connected to, or whether
    they're still active. AgentForger shows that gap is now directly
    exploitable: an agent with full workspace access can be created and
    scheduled to run indefinitely without the account owner ever knowingly
    approving it. Governance frameworks built around "who has access to what
    system" need an equivalent framework for "what agents have access to what
    system," and almost no organization has built one yet.

    Separately, MFA is being treated by many boards as a solved problem. Both
    the Wi-Fi DNS hijacking and Zimbra campaigns show determined attackers
    routing around MFA entirely rather than attacking it directly, credential
    theft is becoming less necessary when session and token theft achieve the
    same result.

  strategic_lessons:
    - "AI agent trust is now an exploitable attack surface distinct from traditional credential theft, requiring its own governance and audit process"
    - "MFA bypass via device-code phishing and zero-click exploits means MFA alone is no longer sufficient evidence of due diligence"
    - "Defensive AI tools (CodeMender, agent audits) are becoming necessary to match the speed of AI-accelerated attacks"

forward_outlook:
  predictions: |
    Expect additional AI agent trust-forgery vulnerabilities to surface across
    other major AI platforms over the next two to three quarters, as
    researchers and attackers alike probe agent-creation and approval flows
    for similar CSRF-style gaps. Organizations that have not established AI
    agent inventories will likely discover unauthorized or forgotten agents
    during future security assessments.

    MFA-bypassing techniques targeting device-code flows and zero-click
    exploits are likely to increase as attackers recognize that phishing
    awareness training has limited effect against attacks requiring no user
    error. Expect wider adoption of AI-driven defensive tooling (automated
    vulnerability discovery and patching) as the primary industry response to
    this acceleration.

